      <img class="logo logo--on-dark" src="assets/images/brand/logo-reversed.webp" width="475" height="140" alt="" aria-hidden="true">
    </a>

    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        <li><a class="site-nav__link" data-nav="home" href="index.html">Home</a></li>
        <li><a class="site-nav__link" data-nav="about" href="about.html">About</a></li>
        <li><a class="site-nav__link" data-nav="services" href="services.html">Services</a></li>

      </ul>

    <a class="btn btn--primary btn--compact site-header__cta" href="contact.html#enquiry" data-magnetic>
      <span class="btn__label">Let's grow</span>
      <span class="btn__icon"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle>
      <span class="menu-toggle__label">Menu</span>
      <span class="menu-toggle__bars" aria-hidden="true"><span></span><span></span></span>
    </button>
