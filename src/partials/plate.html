<!-- Case-study placeholder plate. Args: category, icon, tone, filter.
     Replace the whole <article> with a real project once it is approved and its outcomes verified. -->
<article class="plate plate--{{tone}}" data-plate data-category="{{filter}}">
  <div class="plate__art" aria-hidden="true">
    <svg class="plate__icon"><use href="#i-{{icon}}"/></svg>
  </div>
  <div class="plate__text">
    <p class="plate__status">Case study coming soon</p>
    <h3 class="plate__title">{{category}}</h3>
    <p class="plate__meta">Replace with verified project</p>
  </div>
</article>
