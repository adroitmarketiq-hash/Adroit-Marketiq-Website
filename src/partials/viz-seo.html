<figure class="viz viz--seo" data-viz role="img" aria-label="Illustration: a search query, a results page with your brand highlighted, and a visibility line rising over time.">
  <div class="viz__stage" aria-hidden="true">
    <div class="viz__art">
      <div class="serp">
        <div class="serp__bar">
          <svg class="icon"><use href="#i-seo"/></svg>
          <span class="serp__query">what your customers search for</span><span class="serp__caret"></span>
        </div>
        <ul class="serp__results">
          <li class="serp__row" style="--i:0"><i style="--w:34%"></i><i style="--w:78%"></i></li>
          <li class="serp__row serp__row--brand" style="--i:1"><b>Your brand</b><i style="--w:86%"></i><span class="serp__ping"></span></li>
          <li class="serp__row" style="--i:2"><i style="--w:40%"></i><i style="--w:70%"></i></li>
          <li class="serp__row" style="--i:3"><i style="--w:30%"></i><i style="--w:82%"></i></li>

        <span class="seo-signal__dot"></span>
      </div>
    </div>
  </div>
  <figcaption class="viz__caption">Fig. 1 <span>Search journey, illustrated</span></figcaption>
